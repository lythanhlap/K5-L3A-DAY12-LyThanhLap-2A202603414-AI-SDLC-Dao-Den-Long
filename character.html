<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mây: xem mẫu nhân vật</title>
    <style>html, body { margin: 0; height: 100%; overflow: hidden; background: #2a2a30; } canvas { display: block; }</style>
  </head>
  <body>
    <script type="module">
      // Model viewer for Mây (dev/evidence only). ?angle=deg fixes the view; default auto-rotates.
      import * as THREE from 'three';
      import { makePlayer } from '/src/web/character.js';
      const r = new THREE.WebGLRenderer({ antialias: true });
      r.setSize(innerWidth, innerHeight);
      document.body.appendChild(r.domElement);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#2a2a30');
      scene.add(new THREE.HemisphereLight('#ffffff', '#444455', 1.6));
      const key = new THREE.DirectionalLight('#ffffff', 2);
      key.position.set(3, 5, 4);
      scene.add(key);
      const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 50);
      cam.position.set(0, 1.3, 5.2);
      cam.lookAt(0, 1.05, 0);
      const mây = makePlayer();
      scene.add(mây);
      const fit = () => {
        r.setSize(innerWidth, innerHeight);
        cam.aspect = innerWidth / Math.max(1, innerHeight);
        cam.updateProjectionMatrix();
      };
      addEventListener('resize', fit);
      const fixed = new URLSearchParams(location.search).get('angle');
      (function loop(t) {
        if (r.domElement.width === 0 && innerWidth > 0) fit(); // page loaded while the view had no size
        mây.rotation.y = fixed != null ? (Number(fixed) * Math.PI) / 180 : t / 1500;
        r.render(scene, cam);
        requestAnimationFrame(loop);
      })(0);
    </script>
  </body>
</html>
